<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LawBot</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.3/css/all.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.3/css/all.css">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-image: url("https://img.freepik.com/free-photo/abstract-textured-backgound_1258-30585.jpg?size=626&ext=jpg&ga=GA1.1.149309260.1708338338&semt=ais");
            background-size: cover;
        }
        /* ... */
       h1 {
        background: linear-gradient(to bottom, #33ccff 0%, #ff99cc 100%);
        -webkit-background-clip: text;
        padding: 20px;
    border-radius: 10px;
    display: inline-block;

    }

        /* ... */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            height: 500px; /* Adjust this value as needed */
            overflow-y: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background-color: #fff;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            width: 100%;
            position: sticky;
            bottom: 0;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .user-message {
            color: #007BFF;
            font-weight: bold;
            background-color: #e6f7ff;
        }

        .bot-message {
            color: #333;
            background-color: #f2f2f2;
        }

        /* Add a keyframes animation for the title */
        @keyframes titleAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Style and animate the title */
        h1 {
            background-color: white;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        /* Style the buttons */
        button {
            border: none;
            background: none;
            color: #007BFF;
            cursor: pointer;
            font-size: 1.2em;
        }
    .typing-indicator {
            display: inline-block;
            position: relative;
            width: 20px;
            height: 20px;
        }

        .typing-indicator span {
            position: absolute;
            top: 50%;
            width: 6px;
            height: 6px;
            margin-top: -3px;
            background: #000;
            border-radius: 50%;
            animation: typing-indicator 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            left: 7px;
            animation-delay: .2s;
        }

        .typing-indicator span:nth-child(3) {
            left: 14px;
            animation-delay: .4s;
        }

        @keyframes typing-indicator {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }
    </style>
    <script>
        function copyToClipboard(elementId) {
            var aux = document.createElement("input");
            aux.setAttribute("value", document.getElementById(elementId).innerText);
            document.body.appendChild(aux);
            aux.select();
            document.execCommand("copy");
            document.body.removeChild(aux);
        }

        function updateScroll(){
            var chatContainer = document.getElementById("chatbox");
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            document.getElementById("typing").style.display = "inline-block";
        }

        function hideTypingIndicator() {
            document.getElementById("typing").style.display = "none";
        }
    </script>
</head>
<body onload="updateScroll()">
    <div class="container">
        <h1 class="text-center my-3"><i class="fas fa-gavel"></i> LAWBOT <i class="fas fa-gavel"></i></h1>
        <div id="chatbox" class="chat-container">
            {% for message in messages %}
                <div class="chat-message {{ message.role }}-message">
                    <strong>{{ message.role.title() }}:</strong>
                    <ul>
                        {% for line in message.content.split('\n') %}
                            {% if line.strip() %}
                                <li>{{ line }}</li>
                            {% endif %}
                        {% endfor %}
                    </ul>
                    {% if message.role == 'bot' %}
                        <button onclick="alert('Liked')"><i class="fas fa-thumbs-up"></i></button>
                        <button onclick="alert('Disliked')"><i class="fas fa-thumbs-down"></i></button>
                        <button onclick="copyToClipboard('message{{ loop.index }}')"><i class="fa fa-clipboard"></i></button>
                    {% endif %}
                </div>
            {% endfor %}
            <div id="typing" class="typing-indicator" style="display: none;">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <form method="POST" class="my-3" onsubmit="showTypingIndicator()">
            <div class="input-group">
                <input type="text" name="question" class="form-control" placeholder="Ask something...">
                <div class="input-group-append">
                    <button type="submit" class="btn btn-primary"><i class="fa fa-paper-plane-o"></i></button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
